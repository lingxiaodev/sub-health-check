name: ur-refresh

# URnetwork 家宽节点池：每 2 小时验活重抽，推送单独小订阅
# （ur-clash.yaml / ur-v2ray.txt / ur-meta 到 Cloudflare KV）。
# 状态与订阅文件经 sub-server 的 /ur-push 路由读写 KV，以 GitHub OIDC
# JWT 验权（workflow 需 id-token: write），不再需要 CF_API_TOKEN。
# 凭据走仓库 Secrets：URNETWORK_API_KEY。
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: ur-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh UR residential pool
        env:
          URNETWORK_API_KEY: ${{ secrets.URNETWORK_API_KEY }}
          UR_STATE_MODE: worker
          UR_WORKER_BASE: https://sub.glmd.de5.net
        run: |
          python3 tools/ur/ur_refresh.py
          code=$?
          if [ $code -eq 2 ]; then echo "WARNING: subscription empty, no live nodes"; exit 0; fi
          exit $code
