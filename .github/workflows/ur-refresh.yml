name: ur-refresh

# URnetwork 家宽节点池：每 2 小时验活重抽，推送单独小订阅
# （ur-clash.yaml / ur-v2ray.txt / ur-meta 到 Cloudflare KV）。
# 凭据走仓库 Secrets：URNETWORK_API_KEY、CF_API_TOKEN（仅 KV 读写）。
# 状态（ur-state，含 auth_token）也放 KV，不进仓库。
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

concurrency:
  group: ur-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh UR residential pool
        env:
          URNETWORK_API_KEY: ${{ secrets.URNETWORK_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: 90c6ef034b3c9e87e88efd9ef7a0271c
          CF_KV_NAMESPACE: cfd2cf4db69743aaa2f18efdb117e30a
          UR_STATE_MODE: kv
        run: |
          python3 tools/ur/ur_refresh.py
          code=$?
          if [ $code -eq 2 ]; then echo "WARNING: subscription empty, no live nodes"; exit 0; fi
          exit $code
